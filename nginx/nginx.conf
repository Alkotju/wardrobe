worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # Must be >= API MAX_UPLOAD_BYTES (25MB) so nginx doesn't 413 before the API does.
  client_max_body_size 30m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json
    application/xml image/svg+xml font/ttf font/otf;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Static SPA (vanilla JS, hash routing).
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache static assets (immutable JS/CSS/fonts/images). The SPA shell
    # (index.html) stays uncached so deploys are picked up on next reload.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache" always;
    }

    # REST API — keep the /api prefix when forwarding (no trailing slash on
    # proxy_pass, so nginx passes the original URI unchanged).
    # `^~` gives this prefix priority over the static-asset regex below, so
    # /api/*.json etc. don't get caught by the cache block.
    location ^~ /api/ {
      proxy_pass         http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # Uploaded item images, served by express.static inside the API container.
    # `^~` is required so the static-asset regex (which matches .png/.jpg/…)
    # doesn't preempt this and try to serve from the nginx html root.
    location ^~ /uploads/ {
      proxy_pass         http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # Everything else is the SPA. try_files lets a hard-refresh on /wardrobe
    # (or any other client route) fall back to index.html so hash routing can
    # take over once the page boots.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
