# Pinning the compose project name so volumes named "wardrobe_mongo_data" /
# "wardrobe_uploads" are reused across moves of this directory (the project
# was previously located at a path with Cyrillic letters which produced a
# different default project name).
name: wardrobe

services:
  api:
    build: ./api
    container_name: wardrobe-api
    restart: unless-stopped
    # tini as PID 1: forwards signals + reaps zombies so we can drop dumb-init
    # from the image and shave an apt-get install.
    init: true
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/wardrobe
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - wardrobe-net
    expose:
      - "3000"
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: wardrobe-mongo
    restart: unless-stopped
    # Cap WiredTiger cache so Mongo doesn't grab half the host RAM by default.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo_data:/data/db
    networks:
      - wardrobe-net
    expose:
      - "27017"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      # Root context so the image can pull in both nginx/ config and the
      # static frontend/ in one COPY pass.
      context: .
      dockerfile: nginx/Dockerfile
    container_name: wardrobe-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wardrobe-net
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  wardrobe-net:
    driver: bridge

volumes:
  mongo_data:
  uploads:
